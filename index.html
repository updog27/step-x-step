<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step x Step</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header>
    <img src="logo.png" id="logo" alt="Step x Step logo" onerror="this.style.display='none'">
    <h1>Step x Step</h1>
    <p>Choose your distance. Find your way.</p>
  </header>

  <main>
    <section class="controls" aria-labelledby="route-heading">
      <h2 id="route-heading">Plan your walk</h2>
      <label for="distance-input">Distance</label>
      <input type="number" id="distance-input" min="0.19" step="0.01" placeholder="Distance" value="1">
      <select id="distance-unit" aria-label="Distance unit">
        <option value="miles">Miles</option>
        <option value="km">Kilometers</option>
      </select>
      <select id="route-type" aria-label="Route type">
        <option value="outback">Out-and-back</option>
        <option value="oneway">One-way</option>
        <option value="loop">Loop</option>
        <option value="free">Free run</option>
      </select>
      <div class="button-row">
        <button id="generate-routes-button" type="button">Find Routes</button>
        <button id="start-button" type="button" disabled>Start Walk</button>
        <button id="stop-button" type="button" disabled>Pause</button>
        <button id="reset-button" type="button">Reset Walk</button>
      </div>
      <div id="statusBox" role="status" aria-live="polite">Allow location access to plan a route.</div>
    </section>

    <section class="stats" aria-label="Walk progress">
      <div><span class="stat-label">Distance</span><strong id="distance">0.00 mi</strong></div>
      <div><span class="stat-label">Steps</span><strong id="steps">0</strong></div>
      <div><span class="stat-label">Progress</span><strong id="progress-text">0%</strong></div>
    </section>
    <div id="progressContainer"><div id="progressBar"></div></div>

    <section id="routes-panel" class="routes-panel" hidden>
      <h2>Choose your route</h2>
      <p class="routes-hint">Tap a route card or a colored line on the map to select it.</p>
      <div id="route-list"></div>
    </section>

    <section class="map-section">
      <div class="section-heading">
        <h2>Your route</h2>
        <span id="route-summary">No route selected</span>
      </div>
      <div id="map" aria-label="Map showing your route"></div>
    </section>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
