name: Live OpenStreetMap validation

on:
  workflow_dispatch:
  push:
    branches: [pedestrian-network-prototype]
    paths:
      - 'tools/live-osm-validation.mjs'
      - 'netlify/functions/routes.mjs'
      - '.github/workflows/live-osm-validation.yml'

permissions:
  contents: read

jobs:
  live-osm-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run bounded live OSM validation
        run: node tools/live-osm-validation.mjs
